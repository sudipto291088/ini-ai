# TEMPLATE ONLY. Copy into .streamlit/secrets.toml; never commit real secrets.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_RANDOM_SECRET_AT_LEAST_64_CHARACTERS_LONG"
expose_tokens = []

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid profile email", prompt = "select_account" }
